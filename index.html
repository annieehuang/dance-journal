<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Line Dance Journal</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#f5f0e8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Dance Journal" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #f5f0e8;
      --warm-white: #faf8f4;
      --tan: #e8dece;
      --mid: #c9bba8;
      --stone: #8c7b6b;
      --dark: #3d3328;
      --ink: #2a211a;
      --rule: #d4c9b8;
      --accent: #7a6248;
      --danger: #8b4040;
      --gold: #a07840;
      --serif: 'Playfair Display', Georgia, serif;
      --body: 'Lora', Georgia, serif;
      --radius: 2px;
      --shadow: 0 2px 12px rgba(61,51,40,0.10);
      --shadow-lg: 0 6px 32px rgba(61,51,40,0.14);
    }

    html, body {
      height: 100%;
      background: var(--cream);
      color: var(--ink);
      font-family: var(--body);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    #app {
      max-width: 680px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--warm-white);
      box-shadow: var(--shadow-lg);
    }

    /* HEADER */
    header {
      padding: 28px 28px 0;
      border-bottom: 1px solid var(--rule);
      background: var(--warm-white);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .brand h1 {
      font-family: var(--serif);
      font-size: 1.7rem;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: -0.01em;
      line-height: 1.1;
    }

    .brand p {
      font-family: var(--body);
      font-style: italic;
      color: var(--stone);
      font-size: 0.82rem;
      margin-top: 2px;
    }

    .add-btn {
      background: var(--ink);
      color: var(--cream);
      border: none;
      font-family: var(--body);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 9px 16px;
      cursor: pointer;
      border-radius: var(--radius);
      transition: background 0.18s, transform 0.1s;
      white-space: nowrap;
      margin-top: 4px;
    }
    .add-btn:hover { background: var(--accent); }
    .add-btn:active { transform: scale(0.97); }

    /* TABS */
    .tabs {
      display: flex;
      gap: 0;
    }

    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      font-family: var(--serif);
      font-size: 0.92rem;
      color: var(--stone);
      padding: 12px 8px 14px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.18s, border-color 0.18s;
      letter-spacing: 0.01em;
    }

    .tab-btn.active {
      color: var(--ink);
      border-bottom-color: var(--ink);
    }

    .tab-btn .count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      background: var(--tan);
      border-radius: 50%;
      font-size: 0.68rem;
      font-family: var(--body);
      margin-left: 6px;
      color: var(--stone);
      vertical-align: middle;
    }

    .tab-btn.active .count {
      background: var(--ink);
      color: var(--cream);
    }

    /* MAIN CONTENT */
    main {
      flex: 1;
      padding: 24px 20px;
      overflow-y: auto;
    }

    /* SORT BAR (learn tab) */
    .sort-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .sort-bar label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--stone);
    }

    .sort-bar select {
      font-family: var(--body);
      font-size: 0.8rem;
      background: var(--warm-white);
      border: 1px solid var(--rule);
      color: var(--ink);
      padding: 5px 10px;
      border-radius: var(--radius);
      cursor: pointer;
    }

    /* DANCE CARD */
    .dance-list { display: flex; flex-direction: column; gap: 14px; }

    .dance-card {
      background: var(--warm-white);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      overflow: hidden;
      transition: box-shadow 0.18s;
    }
    .dance-card:hover { box-shadow: var(--shadow); }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 16px 18px 12px;
      cursor: pointer;
      user-select: none;
      gap: 10px;
    }

    .card-left { flex: 1; min-width: 0; }

    .dance-name {
      font-family: var(--serif);
      font-size: 1.05rem;
      color: var(--ink);
      line-height: 1.2;
    }

    .dance-meta {
      margin-top: 5px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .song-tag {
      font-size: 0.73rem;
      font-style: italic;
      color: var(--stone);
      background: var(--tan);
      padding: 2px 8px;
      border-radius: 20px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }

    .card-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    /* PRIORITY BADGE */
    .priority-badge {
      font-family: var(--body);
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 20px;
      white-space: nowrap;
    }
    .priority-high { background: #3d332820; color: var(--ink); border: 1px solid #3d332840; }
    .priority-medium { background: var(--tan); color: var(--stone); border: 1px solid var(--rule); }
    .priority-low { background: var(--warm-white); color: var(--mid); border: 1px solid var(--rule); }

    .expand-icon {
      color: var(--mid);
      font-size: 0.85rem;
      transition: transform 0.2s;
      line-height: 1;
    }
    .dance-card.open .expand-icon { transform: rotate(180deg); }

    /* CARD BODY */
    .card-body {
      display: none;
      padding: 0 18px 18px;
      border-top: 1px solid var(--rule);
      padding-top: 14px;
    }
    .dance-card.open .card-body { display: block; }

    .field-group { margin-bottom: 14px; }

    .field-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--stone);
      margin-bottom: 5px;
      display: block;
    }

    .field-value {
      font-size: 0.88rem;
      color: var(--dark);
      line-height: 1.5;
    }

    .field-value a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 2px;
      word-break: break-all;
    }

    .notes-text {
      font-style: italic;
      color: var(--stone);
      font-size: 0.86rem;
    }

    .no-notes { color: var(--mid); font-style: italic; font-size: 0.84rem; }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--rule);
      flex-wrap: wrap;
    }

    .btn-sm {
      font-family: var(--body);
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 6px 13px;
      border-radius: var(--radius);
      border: 1px solid var(--rule);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      background: var(--warm-white);
      color: var(--stone);
    }
    .btn-sm:hover { background: var(--tan); color: var(--ink); }
    .btn-sm.primary { background: var(--ink); color: var(--cream); border-color: var(--ink); }
    .btn-sm.primary:hover { background: var(--accent); border-color: var(--accent); }
    .btn-sm.danger:hover { background: #f5eaea; color: var(--danger); border-color: #d4b0b0; }

    /* EMPTY STATE */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--stone);
    }
    .empty-state .glyph {
      font-size: 2.5rem;
      margin-bottom: 14px;
      opacity: 0.5;
    }
    .empty-state h3 {
      font-family: var(--serif);
      font-size: 1.2rem;
      color: var(--dark);
      margin-bottom: 6px;
    }
    .empty-state p { font-style: italic; font-size: 0.86rem; }

    /* MODAL OVERLAY */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(42,33,26,0.45);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--warm-white);
      width: 100%;
      max-width: 680px;
      border-radius: 8px 8px 0 0;
      padding: 28px 24px 36px;
      max-height: 90dvh;
      overflow-y: auto;
      box-shadow: 0 -8px 40px rgba(42,33,26,0.18);
      animation: slideUp 0.22s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-title {
      font-family: var(--serif);
      font-size: 1.3rem;
      color: var(--ink);
      margin-bottom: 22px;
    }

    .form-group { margin-bottom: 18px; }

    .form-group label {
      display: block;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--stone);
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      font-family: var(--body);
      font-size: 0.9rem;
      color: var(--ink);
      background: var(--cream);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      padding: 9px 12px;
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: var(--stone);
    }
    .form-group textarea { resize: vertical; min-height: 80px; }

    .form-hint {
      font-size: 0.73rem;
      font-style: italic;
      color: var(--mid);
      margin-top: 4px;
    }

    .song-inputs { display: flex; flex-direction: column; gap: 8px; }

    .song-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .song-row input { flex: 1; }
    .song-row button {
      background: none;
      border: 1px solid var(--rule);
      color: var(--mid);
      cursor: pointer;
      padding: 7px 9px;
      border-radius: var(--radius);
      font-size: 0.85rem;
      line-height: 1;
      flex-shrink: 0;
    }
    .song-row button:hover { color: var(--danger); border-color: #d4b0b0; background: #f5eaea; }

    .add-song-btn {
      background: none;
      border: 1px dashed var(--rule);
      color: var(--stone);
      font-family: var(--body);
      font-size: 0.78rem;
      letter-spacing: 0.05em;
      padding: 7px 12px;
      cursor: pointer;
      border-radius: var(--radius);
      width: 100%;
      text-align: left;
      transition: background 0.15s;
    }
    .add-song-btn:hover { background: var(--tan); }

    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 24px;
      justify-content: flex-end;
    }

    .btn-cancel {
      font-family: var(--body);
      font-size: 0.82rem;
      letter-spacing: 0.05em;
      background: none;
      border: 1px solid var(--rule);
      color: var(--stone);
      padding: 10px 18px;
      border-radius: var(--radius);
      cursor: pointer;
    }
    .btn-save {
      font-family: var(--body);
      font-size: 0.82rem;
      letter-spacing: 0.05em;
      background: var(--ink);
      color: var(--cream);
      border: none;
      padding: 10px 22px;
      border-radius: var(--radius);
      cursor: pointer;
    }
    .btn-save:hover { background: var(--accent); }

    /* PRIORITY SELECTOR */
    .priority-selector {
      display: flex;
      gap: 8px;
    }
    .priority-option {
      flex: 1;
      text-align: center;
      padding: 8px 6px;
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 0.78rem;
      font-family: var(--body);
      transition: all 0.15s;
      color: var(--stone);
    }
    .priority-option:hover { border-color: var(--stone); }
    .priority-option.selected-high { background: var(--ink); color: var(--cream); border-color: var(--ink); }
    .priority-option.selected-medium { background: var(--tan); color: var(--dark); border-color: var(--stone); }
    .priority-option.selected-low { background: var(--cream); color: var(--stone); border-color: var(--mid); }

    /* MOVE TO LEARNED CONFIRM */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: var(--ink);
      color: var(--cream);
      font-family: var(--body);
      font-size: 0.82rem;
      padding: 10px 20px;
      border-radius: 40px;
      z-index: 300;
      transition: transform 0.25s ease, opacity 0.25s;
      opacity: 0;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    @media (max-width: 480px) {
      header { padding: 18px 16px 0; }
      main { padding: 18px 14px; }
      .brand h1 { font-size: 1.4rem; }
      .modal { padding: 22px 16px 32px; }
    }
  </style>
</head>
<body>
<div id="app">
  <header>
    <div class="header-top">
      <div class="brand">
        <h1>Dance Journal</h1>
        <p>annie's line dance collection</p>
      </div>
      <div style="display:flex;align-items:center;gap:14px;">
        <svg width="56" height="50" viewBox="0 0 56 50" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="flex-shrink:0;opacity:0.78;">
          <!-- Left boot -->
          <g stroke="#3d3328" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" fill="none">
            <path d="M8 2 C8 2 6.5 3.5 6 7 C5.5 10.5 5.5 18 5.5 22"/>
            <path d="M16 2 C16 2 17.5 3.5 18 7 C18.5 10.5 18.5 18 18.5 22"/>
            <path d="M8 2 Q12 0.5 16 2"/>
            <path d="M5.5 22 C5.5 22 5 24 3.5 26.5 C2.5 28.5 2 30 2 31.5 C2 33 3 34 5 34.5 L18 34.5"/>
            <path d="M18.5 22 L20 27 L20 31.5 C20 33 19 34.2 18 34.5"/>
            <path d="M2 31.5 L2 34.5 C2 36 3.5 37 6 37 L18 37 C19.5 37 20.5 36 20.5 34.5 L20.5 31.5"/>
            <path d="M9.5 5 Q12 4.2 14.5 5" stroke-dasharray="1.2 1.5"/>
            <path d="M9 9 Q12 8.2 15 9" stroke-dasharray="1.2 1.5"/>
            <path d="M8.2 2.3 L7.2 6"/>
            <path d="M15.8 2.3 L16.8 6"/>
            <path d="M12 14 L12.7 16.2 L15 16.2 L13.2 17.5 L13.9 19.7 L12 18.4 L10.1 19.7 L10.8 17.5 L9 16.2 L11.3 16.2 Z" stroke-width="0.9"/>
          </g>
          <!-- Right boot (offset right and slightly lower) -->
          <g stroke="#3d3328" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(19, 5)">
            <path d="M8 2 C8 2 6.5 3.5 6 7 C5.5 10.5 5.5 18 5.5 22"/>
            <path d="M16 2 C16 2 17.5 3.5 18 7 C18.5 10.5 18.5 18 18.5 22"/>
            <path d="M8 2 Q12 0.5 16 2"/>
            <path d="M5.5 22 C5.5 22 5 24 3.5 26.5 C2.5 28.5 2 30 2 31.5 C2 33 3 34 5 34.5 L18 34.5"/>
            <path d="M18.5 22 L20 27 L20 31.5 C20 33 19 34.2 18 34.5"/>
            <path d="M2 31.5 L2 34.5 C2 36 3.5 37 6 37 L18 37 C19.5 37 20.5 36 20.5 34.5 L20.5 31.5"/>
            <path d="M9.5 5 Q12 4.2 14.5 5" stroke-dasharray="1.2 1.5"/>
            <path d="M9 9 Q12 8.2 15 9" stroke-dasharray="1.2 1.5"/>
            <path d="M8.2 2.3 L7.2 6"/>
            <path d="M15.8 2.3 L16.8 6"/>
            <path d="M12 14 L12.7 16.2 L15 16.2 L13.2 17.5 L13.9 19.7 L12 18.4 L10.1 19.7 L10.8 17.5 L9 16.2 L11.3 16.2 Z" stroke-width="0.9"/>
          </g>
        </svg>
        <button class="add-btn" onclick="openAddModal()">+ Add Dance</button>
      </div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" id="tab-know" onclick="switchTab('know')">
        Known <span class="count" id="count-know">0</span>
      </button>
      <button class="tab-btn" id="tab-learn" onclick="switchTab('learn')">
        Want to Learn <span class="count" id="count-learn">0</span>
      </button>
    </div>
  </header>

  <main id="main-content"></main>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-title" id="modal-title">Add a Dance</div>

    <div class="form-group">
      <label>Dance Name</label>
      <input type="text" id="f-name" placeholder="e.g. Tush Push" />
      <div class="form-hint">Leave blank if only known by song name</div>
    </div>

    <div class="form-group">
      <label>Songs Associated</label>
      <div class="song-inputs" id="song-inputs"></div>
      <button class="add-song-btn" onclick="addSongField()">+ add song</button>
    </div>

    <div class="form-group">
      <label>Notes</label>
      <textarea id="f-notes" placeholder="Styling tips, where you learned it, counts, etc."></textarea>
    </div>

    <div class="form-group">
      <label>Step Sheet Link</label>
      <input type="url" id="f-link" placeholder="https://copperknob.co.uk/..." />
    </div>

    <div class="form-group" id="tab-selector-group">
      <label>Status</label>
      <select id="f-tab">
        <option value="know">I know this dance</option>
        <option value="learn">I want to learn this</option>
      </select>
    </div>

    <div class="form-group" id="priority-group" style="display:none;">
      <label>Priority</label>
      <div class="priority-selector">
        <div class="priority-option" data-p="high" onclick="selectPriority('high')">High</div>
        <div class="priority-option" data-p="medium" onclick="selectPriority('medium')">Medium</div>
        <div class="priority-option" data-p="low" onclick="selectPriority('low')">Low</div>
      </div>
    </div>

    <div class="form-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveDance()">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ─── STATE ───────────────────────────────────────────────────
  const STORAGE_KEY = 'danceJournal_v1';

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : { know: [], learn: [] };
    } catch { return { know: [], learn: [] }; }
  }

  function saveData(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  let data = loadData();
  let currentTab = 'know';
  let editingId = null;
  let selectedPriority = 'medium';
  let currentSort = 'priority';

  // ─── TAB SWITCHING ───────────────────────────────────────────
  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('tab-know').classList.toggle('active', tab === 'know');
    document.getElementById('tab-learn').classList.toggle('active', tab === 'learn');
    renderMain();
  }

  // ─── RENDER ──────────────────────────────────────────────────
  function updateCounts() {
    document.getElementById('count-know').textContent = data.know.length;
    document.getElementById('count-learn').textContent = data.learn.length;
  }

  function renderMain() {
    updateCounts();
    const main = document.getElementById('main-content');
    const list = data[currentTab];

    if (currentTab === 'learn' && list.length === 0) {
      main.innerHTML = emptyState('♩', 'Nothing queued yet', 'Add dances you want to tackle next.');
      return;
    }
    if (currentTab === 'know' && list.length === 0) {
      main.innerHTML = emptyState('♪', 'Your repertoire awaits', 'Start logging the dances in your toolkit.');
      return;
    }

    let sortedList = [...list];
    if (currentTab === 'learn') {
      const sortBar = `
        <div class="sort-bar">
          <label>Sort by</label>
          <select onchange="changeSort(this.value)">
            <option value="priority" ${currentSort==='priority'?'selected':''}>Priority</option>
            <option value="name" ${currentSort==='name'?'selected':''}>Name A–Z</option>
            <option value="added" ${currentSort==='added'?'selected':''}>Recently Added</option>
          </select>
        </div>`;
      const priorityOrder = { high: 0, medium: 1, low: 2 };
      if (currentSort === 'priority') {
        sortedList.sort((a, b) => (priorityOrder[a.priority] ?? 1) - (priorityOrder[b.priority] ?? 1));
      } else if (currentSort === 'name') {
        sortedList.sort((a, b) => (a.name || a.songs[0] || '').localeCompare(b.name || b.songs[0] || ''));
      } else if (currentSort === 'added') {
        sortedList.sort((a, b) => b.added - a.added);
      }
      main.innerHTML = sortBar + `<div class="dance-list">${sortedList.map(cardHTML).join('')}</div>`;
    } else {
      sortedList.sort((a, b) => (a.name || a.songs[0] || '').localeCompare(b.name || b.songs[0] || ''));
      main.innerHTML = `<div class="dance-list">${sortedList.map(cardHTML).join('')}</div>`;
    }
  }

  function emptyState(glyph, title, sub) {
    return `<div class="empty-state">
      <div class="glyph">${glyph}</div>
      <h3>${title}</h3>
      <p>${sub}</p>
    </div>`;
  }

  function cardHTML(dance) {
    const displayName = dance.name || (dance.songs[0] ? `<em>${esc(dance.songs[0])}</em>` : '<em>Unnamed Dance</em>');
    const songTags = dance.songs.slice(0, 3).map(s => `<span class="song-tag">${esc(s)}</span>`).join('');
    const priorityBadge = dance.tab === 'learn'
      ? `<span class="priority-badge priority-${dance.priority}">${dance.priority}</span>` : '';

    const songList = dance.songs.length
      ? dance.songs.map(s => `<div>${esc(s)}</div>`).join('')
      : '<span class="no-notes">None listed</span>';

    const notesHtml = dance.notes
      ? `<p class="notes-text">${esc(dance.notes).replace(/\n/g,'<br>')}</p>`
      : '<span class="no-notes">No notes yet</span>';

    const linkHtml = dance.link
      ? `<a href="${esc(dance.link)}" target="_blank" rel="noopener">${esc(dance.link)}</a>`
      : '<span class="no-notes">No link added</span>';

    const moveBtn = dance.tab === 'learn'
      ? `<button class="btn-sm primary" onclick="moveTabs('${dance.id}')">Mark as Learned</button>`
      : `<button class="btn-sm" onclick="moveTabs('${dance.id}')">Move to Want to Learn</button>`;

    const priorityEdit = dance.tab === 'learn' ? `
      <div class="field-group">
        <span class="field-label">Priority</span>
        <select style="font-family:var(--body);font-size:0.82rem;border:1px solid var(--rule);background:var(--cream);padding:5px 10px;border-radius:var(--radius);color:var(--ink);" onchange="changePriority('${dance.id}', this.value)">
          <option ${dance.priority==='high'?'selected':''} value="high">High</option>
          <option ${dance.priority==='medium'?'selected':''} value="medium">Medium</option>
          <option ${dance.priority==='low'?'selected':''} value="low">Low</option>
        </select>
      </div>` : '';

    return `
      <div class="dance-card" id="card-${dance.id}">
        <div class="card-header" onclick="toggleCard('${dance.id}')">
          <div class="card-left">
            <div class="dance-name">${displayName}</div>
            <div class="dance-meta">${songTags}</div>
          </div>
          <div class="card-right">
            ${priorityBadge}
            <span class="expand-icon">▾</span>
          </div>
        </div>
        <div class="card-body">
          <div class="field-group">
            <span class="field-label">Songs</span>
            <div class="field-value">${songList}</div>
          </div>
          <div class="field-group">
            <span class="field-label">Notes</span>
            <div class="field-value">${notesHtml}</div>
          </div>
          <div class="field-group">
            <span class="field-label">Step Sheet</span>
            <div class="field-value">${linkHtml}</div>
          </div>
          ${priorityEdit}
          <div class="card-actions">
            ${moveBtn}
            <button class="btn-sm" onclick="editDance('${dance.id}')">Edit</button>
            <button class="btn-sm danger" onclick="deleteDance('${dance.id}')">Delete</button>
          </div>
        </div>
      </div>`;
  }

  function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ─── CARD TOGGLE ─────────────────────────────────────────────
  function toggleCard(id) {
    document.getElementById('card-' + id).classList.toggle('open');
  }

  // ─── SORT ────────────────────────────────────────────────────
  function changeSort(val) {
    currentSort = val;
    renderMain();
  }

  // ─── PRIORITY INLINE CHANGE ──────────────────────────────────
  function changePriority(id, val) {
    const item = data.learn.find(d => d.id === id);
    if (item) { item.priority = val; saveData(data); renderMain(); }
  }

  // ─── MODAL ───────────────────────────────────────────────────
  function openAddModal() {
    editingId = null;
    selectedPriority = 'medium';
    document.getElementById('modal-title').textContent = 'Add a Dance';
    document.getElementById('f-name').value = '';
    document.getElementById('f-notes').value = '';
    document.getElementById('f-link').value = '';
    document.getElementById('f-tab').value = currentTab;
    resetSongFields([]);
    selectPriority('medium');
    updatePriorityVisibility();
    document.getElementById('modal-overlay').classList.add('open');
  }

  function openAddModalForTab(tab) {
    openAddModal();
    document.getElementById('f-tab').value = tab;
    updatePriorityVisibility();
  }

  function editDance(id) {
    const dance = [...data.know, ...data.learn].find(d => d.id === id);
    if (!dance) return;
    editingId = id;
    selectedPriority = dance.priority || 'medium';
    document.getElementById('modal-title').textContent = 'Edit Dance';
    document.getElementById('f-name').value = dance.name || '';
    document.getElementById('f-notes').value = dance.notes || '';
    document.getElementById('f-link').value = dance.link || '';
    document.getElementById('f-tab').value = dance.tab;
    resetSongFields(dance.songs || []);
    selectPriority(selectedPriority);
    updatePriorityVisibility();
    document.getElementById('modal-overlay').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    editingId = null;
  }

  function handleOverlayClick(e) {
    if (e.target === document.getElementById('modal-overlay')) closeModal();
  }

  function resetSongFields(songs) {
    const container = document.getElementById('song-inputs');
    container.innerHTML = '';
    const list = songs.length ? songs : [''];
    list.forEach(s => addSongField(s));
  }

  function addSongField(value = '') {
    const container = document.getElementById('song-inputs');
    const row = document.createElement('div');
    row.className = 'song-row';
    row.innerHTML = `<input type="text" placeholder="Song name or title" value="${esc(value)}" />
      <button onclick="removeSongRow(this)" title="Remove">✕</button>`;
    container.appendChild(row);
  }

  function removeSongRow(btn) {
    const rows = document.querySelectorAll('#song-inputs .song-row');
    if (rows.length > 1) btn.closest('.song-row').remove();
    else btn.closest('.song-row').querySelector('input').value = '';
  }

  function selectPriority(p) {
    selectedPriority = p;
    document.querySelectorAll('.priority-option').forEach(el => {
      el.className = 'priority-option';
      if (el.dataset.p === p) el.classList.add('selected-' + p);
    });
  }

  function updatePriorityVisibility() {
    const tabVal = document.getElementById('f-tab').value;
    document.getElementById('priority-group').style.display = tabVal === 'learn' ? 'block' : 'none';
  }

  document.getElementById('f-tab').addEventListener('change', updatePriorityVisibility);

  function saveDance() {
    const name = document.getElementById('f-name').value.trim();
    const notes = document.getElementById('f-notes').value.trim();
    const link = document.getElementById('f-link').value.trim();
    const tab = document.getElementById('f-tab').value;
    const songs = [...document.querySelectorAll('#song-inputs .song-row input')]
      .map(i => i.value.trim()).filter(Boolean);

    if (!name && songs.length === 0) {
      alert('Please enter a dance name or at least one song name.');
      return;
    }

    if (editingId) {
      ['know','learn'].forEach(t => {
        const idx = data[t].findIndex(d => d.id === editingId);
        if (idx !== -1) {
          const dance = data[t][idx];
          data[t].splice(idx, 1);
          dance.name = name; dance.songs = songs; dance.notes = notes;
          dance.link = link; dance.tab = tab;
          if (tab === 'learn') dance.priority = selectedPriority;
          data[tab].push(dance);
        }
      });
    } else {
      const dance = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2,5),
        name, songs, notes, link, tab,
        priority: tab === 'learn' ? selectedPriority : null,
        added: Date.now()
      };
      data[tab].push(dance);
    }

    saveData(data);
    closeModal();
    renderMain();
    showToast(editingId ? 'Dance updated' : 'Dance added ✓');
  }

  // ─── ACTIONS ─────────────────────────────────────────────────
  function deleteDance(id) {
    if (!confirm('Remove this dance?')) return;
    ['know','learn'].forEach(t => {
      data[t] = data[t].filter(d => d.id !== id);
    });
    saveData(data); renderMain();
    showToast('Dance removed');
  }

  function moveTabs(id) {
    let dance, fromTab;
    ['know','learn'].forEach(t => {
      const idx = data[t].findIndex(d => d.id === id);
      if (idx !== -1) { dance = data[t].splice(idx, 1)[0]; fromTab = t; }
    });
    if (!dance) return;
    const toTab = fromTab === 'know' ? 'learn' : 'know';
    dance.tab = toTab;
    if (toTab === 'learn' && !dance.priority) dance.priority = 'medium';
    data[toTab].push(dance);
    saveData(data); renderMain();
    showToast(toTab === 'know' ? '🎉 Marked as learned!' : 'Moved to Want to Learn');
  }

  // ─── TOAST ───────────────────────────────────────────────────
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  // ─── INIT ─────────────────────────────────────────────────────
  renderMain();
</script>
</body>
</html>
